<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>popup</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #fafafa;
      --muted: #737373;
      --surface: #141414;
      --border: #2a2a2a;
      --button: #fafafa;
      --button-text: #0a0a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(250, 250, 250, 0.08), transparent 55%),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 28px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 52px;
      padding: 0 24px;
      border: none;
      border-radius: 14px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .cta:active { transform: scale(0.97); }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">popup</div>
    <div class="mark" id="mark" aria-hidden="true">✓</div>
    <h1 id="title">Your account is verified</h1>
    <p id="message">
      Returning you to the popup app so you can create your password…
    </p>
    <a class="cta" id="openApp" href="popup://auth-callback">Open popup</a>
    <p class="hint" id="hint">If nothing happens, tap Open popup.</p>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var stripe = (params.get("stripe") || "").toLowerCase();
      var square = (params.get("square") || "").toLowerCase();
      var mark = document.getElementById("mark");
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var openApp = document.getElementById("openApp");
      var hint = document.getElementById("hint");
      var appUrl;

      if (square === "return" || stripe === "return") {
        document.title = "Square connected · popup";
        mark.textContent = "✓";
        title.textContent = "Square setup complete";
        message.textContent = "You can return to popup and cash out from Settings.";
        hint.textContent = "If nothing happens, tap Open popup.";
        appUrl = "popup://square-oauth?connected=1";
      } else if (square === "refresh" || stripe === "refresh") {
        document.title = "Finish Square · popup";
        mark.textContent = "!";
        title.textContent = "Finish Square setup";
        message.textContent = "Open popup and tap Connect Square again.";
        hint.textContent = "If nothing happens, tap Open popup.";
        appUrl = "popup://square-oauth?error=refresh";
      } else {
        var query = window.location.search || "";
        var hash = window.location.hash || "";
        var joined = query ? (query + "&popup_verified=1") : "?popup_verified=1";
        appUrl = "popup://auth-callback" + joined + hash;
      }

      openApp.setAttribute("href", appUrl);
      setTimeout(function () { window.location.href = appUrl; }, 400);
      setTimeout(function () { window.location.href = appUrl; }, 1600);
    })();
  </script>
</body>
</html>
