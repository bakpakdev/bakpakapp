<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Confirm email · popup</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #fafafa;
      --muted: #737373;
      --surface: #141414;
      --border: #2a2a2a;
      --button: #fafafa;
      --button-text: #0a0a0a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(250, 250, 250, 0.08), transparent 55%),
        var(--bg);
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 52px;
      padding: 0 24px;
      border: none;
      border-radius: 14px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .cta:active { transform: scale(0.97); }
    .cta[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
    .hint { margin-top: 20px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">popup</div>
    <h1>Open popup to confirm</h1>
    <p>Tap the button below on this phone. That opens popup so you can finish confirming your campus email.</p>
    <a class="cta" id="openApp" href="popup://auth-callback">Open popup</a>
    <p class="hint">Don’t use a laptop for this step — the link has to open the app on your phone.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var campus = params.get("campus_token") || "";
      var hash = params.get("token_hash") || params.get("token") || "";
      var type = params.get("type") || "signup";
      var openApp = document.getElementById("openApp");
      var appUrl = "";
      if (campus) {
        appUrl = "popup://auth-callback?campus_token=" + encodeURIComponent(campus);
      } else if (hash) {
        appUrl = "popup://auth-callback?token_hash="
          + encodeURIComponent(hash)
          + "&type=" + encodeURIComponent(type);
      } else {
        openApp.setAttribute("aria-disabled", "true");
        openApp.removeAttribute("href");
        openApp.textContent = "Link missing";
        return;
      }
      openApp.setAttribute("href", appUrl);
    })();
  </script>
</body>
</html>
