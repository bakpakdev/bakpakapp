<!DOCTYPE html>
<html>
<body style="margin:0;padding:32px;background:#0A0A0A;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#FAFAFA;">
  <div style="max-width:440px;margin:0 auto;">
    <p style="font-size:28px;font-weight:800;letter-spacing:1px;margin:0 0 24px;">popup</p>
    <p style="font-size:18px;font-weight:600;margin:0 0 12px;">Confirm your campus email</p>
    <p style="font-size:15px;line-height:1.5;color:#A3A3A3;margin:0 0 28px;">
      Tap below to verify this is your school email and finish creating your popup account.
      This link expires, so use it soon.
    </p>
    <p>
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#FAFAFA;color:#0A0A0A;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:999px;">
        Open popup
      </a>
    </p>
    <p style="font-size:12px;color:#737373;margin-top:32px;">
      If you didn’t sign up for popup, you can ignore this email.
    </p>
  </div>
</body>
</html>
