# Render blueprint for the popup backend (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this file,
# builds backend/Dockerfile. Live service host (sandbox):
#   https://popup-api-hwbg.onrender.com
# iOS Secrets: API_BASE_URL_RELEASE = https:/$()/popup-api-hwbg.onrender.com/api
#
# Required Stripe env (set in Render dashboard; sync: false = never in git):
#   PUBLIC_BASE_URL=https://popup-api-hwbg.onrender.com
#   STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY (test keys until launch)
#   STRIPE_WEBHOOK_SECRET from a Stripe webhook pointed at
#     https://popup-api-hwbg.onrender.com/api/payments/webhook
# Probe: GET /api/payments/health
services:
  - type: web
    name: popup-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (sync: false = never stored in git).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Must match the live host (popup-api-hwbg.onrender.com). Stripe onboarding
      # return links and the webhook URL are built from it.
      - key: PUBLIC_BASE_URL
        sync: false
      # Seller service fee popup keeps (see backend/lib/platformFee.js).
      - key: PLATFORM_FEE_PERCENT
        value: "10"
      - key: PLATFORM_FEE_MIN_CENTS
        value: "50"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: IDENTIFY_RATE_LIMIT_PER_HOUR
        value: "12"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: PAYOUT_MFA_MAX_AGE_SECONDS
        value: "600"
      # Unused by the scanner (Supabase is the live DB). Dummy so Prisma can boot.
      - key: DATABASE_URL
        value: mysql://unused:unused@127.0.0.1:3306/unused
