# Render blueprint for the popup backend (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this file,
# builds backend/Dockerfile. Live service host (sandbox):
#   https://popup-api-hwbg.onrender.com
# iOS Secrets: API_BASE_URL_RELEASE = https:/$()/popup-api-hwbg.onrender.com/api
#
# Required Square sandbox env (set in Render dashboard; sync: false = never in git):
#   PUBLIC_BASE_URL=https://popup-api-hwbg.onrender.com
#   SQUARE_OAUTH_REDIRECT_URI=https://popup-api-hwbg.onrender.com/api/payments/square/oauth/callback
#   SQUARE_WEBHOOK_NOTIFICATION_URL=https://popup-api-hwbg.onrender.com/api/payments/square/webhook
# Register those two URLs in the Square Developer Dashboard (sandbox app), then paste
# SQUARE_WEBHOOK_SIGNATURE_KEY. Probe: GET /api/payments/health
services:
  - type: web
    name: popup-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (sync: false = never stored in git).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SQUARE_ENVIRONMENT
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_APPLICATION_SECRET
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
      # Must match the live host (popup-api-hwbg.onrender.com). Also register OAuth
      # redirect + webhook URLs in the Square developer dashboard (sandbox).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SQUARE_OAUTH_REDIRECT_URI
        sync: false
      - key: SQUARE_WEBHOOK_NOTIFICATION_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: IDENTIFY_RATE_LIMIT_PER_HOUR
        value: "12"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      # Unused by the scanner (Supabase is the live DB). Dummy so Prisma can boot.
      - key: DATABASE_URL
        value: mysql://unused:unused@127.0.0.1:3306/unused
