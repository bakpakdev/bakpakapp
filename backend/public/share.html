<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shop on popup</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #fafafa;
      --muted: #737373;
      --surface: #141414;
      --border: #2a2a2a;
      --button: #fafafa;
      --button-text: #0a0a0a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(250, 250, 250, 0.08), transparent 55%),
        var(--bg);
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 40px;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 26px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      height: 52px;
      padding: 0 24px;
      border-radius: 14px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .cta:active { transform: scale(0.97); }
    .hint { margin-top: 20px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">popup</div>
    <div class="mark" aria-hidden="true">⌂</div>
    <h1 id="title">Open this closet in popup</h1>
    <p id="message">This link opens a campus seller’s shop in the popup app.</p>
    <a class="cta" id="openApp" href="popup://profile">Open in popup</a>
    <p class="hint">If nothing happens, install popup, then tap Open in popup.</p>
  </main>
  <script>
    (function () {
      var parts = (window.location.pathname || "").split("/").filter(Boolean);
      var username = decodeURIComponent(parts[parts.length - 1] || "");
      if (username === "u" || username === "share.html") username = "";
      var id = new URLSearchParams(window.location.search || "").get("id") || "";
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var openApp = document.getElementById("openApp");
      var handle = username.replace(/^@/, "");
      var appUrl = id
        ? "popup://profile/" + encodeURIComponent(id)
        : "popup://u/" + encodeURIComponent(handle);
      if (handle) {
        title.textContent = "@" + handle + " on popup";
        message.textContent = "Open popup to see their closet and meet up in person.";
        document.title = "@" + handle + " · popup";
      }
      openApp.setAttribute("href", appUrl);
      setTimeout(function () { window.location.href = appUrl; }, 350);
    })();
  </script>
</body>
</html>
