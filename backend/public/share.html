<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <!--META-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0a0a0a;
      --ink: #fafafa;
      --mute: #8a8a8a;
      --line: #232323;
      --tile: #161616;
      --display: "Syne", "Arial Black", system-ui, sans-serif;
      --body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
    .top { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; }
    .brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; }
    .tag { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .avatar { width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 18px; background: var(--tile) center/cover no-repeat; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 40px; }
    h1 { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; letter-spacing: -0.03em; margin-bottom: 8px; text-wrap: balance; }
    .handle { color: var(--mute); font-size: 15px; margin-bottom: 20px; }
    .stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
    .stat { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; }
    .stat b { font-family: var(--display); font-weight: 700; margin-right: 4px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 28px; }
    .grid div { aspect-ratio: 4 / 5; border-radius: 14px; background: var(--tile) center/cover no-repeat; }
    .grid:empty { display: none; }
    .cta { display: flex; align-items: center; justify-content: center; width: 100%; height: 54px; border-radius: 999px; background: var(--ink); color: var(--bg); font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; text-decoration: none; }
    .cta:active { transform: scale(0.98); }
    .hint { margin-top: 14px; font-size: 13px; color: var(--mute); }
    .hint a { color: var(--ink); }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">popup</div>
    <div class="tag">closet</div>
  </div>
  <main>
    <div class="avatar" id="avatar"></div>
    <h1 id="name">Shop this closet</h1>
    <div class="handle" id="handle">on popup</div>
    <div class="stats" id="stats"></div>
    <div class="grid" id="grid"></div>
    <a class="cta" id="openApp" href="popup://profile">Open closet in popup</a>
    <p class="hint">Don’t have popup yet? <a href="https://www.usepopupapp.com">Get the app</a></p>
  </main>
  <script>
    (function () {
      var data = /*CLOSET_DATA*/null || {};
      if (!data.username) {
        var parts = (window.location.pathname || "").split("/").filter(Boolean);
        var last = decodeURIComponent(parts[parts.length - 1] || "");
        data.username = (last === "u" || last === "share.html") ? "" : last.replace(/^@/, "");
        data.id = new URLSearchParams(window.location.search || "").get("id") || "";
      }
      var $ = function (id) { return document.getElementById(id); };
      var name = data.shopName || (data.username ? "@" + data.username : "Shop this closet");
      $("name").textContent = name;
      $("handle").textContent = data.username ? "@" + data.username + " · on popup" : "on popup";

      var avatar = $("avatar");
      if (data.avatarUrl) avatar.style.backgroundImage = "url(" + JSON.stringify(data.avatarUrl) + ")";
      else avatar.textContent = (name.replace("@", "")[0] || "p").toUpperCase();

      var stats = $("stats");
      function stat(n, label) {
        var el = document.createElement("div");
        el.className = "stat";
        var b = document.createElement("b");
        b.textContent = n;
        el.appendChild(b);
        el.appendChild(document.createTextNode(label));
        stats.appendChild(el);
      }
      if (typeof data.listingCount === "number") stat(data.listingCount, data.listingCount === 1 ? "listing" : "listings");
      if (typeof data.soldCount === "number" && data.soldCount > 0) stat(data.soldCount, "sold");
      if (data.reviewCount > 0) stat(data.reviewAverage.toFixed(1) + "★", "(" + data.reviewCount + ")");

      var grid = $("grid");
      (data.photos || []).slice(0, 4).forEach(function (url) {
        var tile = document.createElement("div");
        tile.style.backgroundImage = "url(" + JSON.stringify(url) + ")";
        grid.appendChild(tile);
      });

      var appUrl = data.id
        ? "popup://profile/" + encodeURIComponent(data.id)
        : "popup://u/" + encodeURIComponent(data.username || "");
      $("openApp").setAttribute("href", appUrl);
      setTimeout(function () { window.location.href = appUrl; }, 450);
    })();
  </script>
</body>
</html>
